<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Employee Crosswalk Review</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <div class="max-w-6xl mx-auto p-6">
    <header class="mb-6 flex items-end justify-between gap-4">
      <div>
        <h1 class="text-2xl font-semibold">Employee Crosswalk Review</h1>
        <p class="text-sm text-slate-600">Confirm or override matches that the matcher couldn't auto-resolve.</p>
      </div>
      <button id="refresh" class="px-3 py-2 rounded bg-slate-900 text-white text-sm">Refresh</button>
    </header>

    <section id="summary" class="mb-4 grid grid-cols-2 sm:grid-cols-5 gap-2 text-xs"></section>

    <section class="mb-4 flex flex-wrap items-center gap-2 bg-white rounded shadow p-3">
      <div class="flex gap-1 mr-2">
        <button data-tab="manual-review" class="tab-btn px-3 py-1.5 rounded text-sm bg-slate-900 text-white">Manual review</button>
        <button data-tab="unmatched" class="tab-btn px-3 py-1.5 rounded text-sm bg-slate-100 text-slate-700">Unmatched</button>
        <button data-tab="all" class="tab-btn px-3 py-1.5 rounded text-sm bg-slate-100 text-slate-700">All</button>
      </div>
      <input id="search" type="search" placeholder="Search by name, community, title..."
             class="flex-1 min-w-48 border rounded px-3 py-1.5 text-sm" />
      <select id="dept-filter" class="border rounded px-2 py-1.5 text-sm">
        <option value="">All departments</option>
      </select>
      <select id="comm-filter" class="border rounded px-2 py-1.5 text-sm">
        <option value="">All communities</option>
      </select>
      <span id="visible-count" class="text-xs text-slate-500 ml-auto"></span>
    </section>

    <div id="rows" class="space-y-3"></div>
    <p id="empty" class="hidden text-center text-slate-500 mt-12 text-sm">No items match the current filters.</p>
  </div>

  <template id="row-tmpl">
    <article class="row bg-white rounded shadow p-4">
      <div class="flex items-start justify-between gap-4">
        <div>
          <div class="flex items-center gap-2">
            <h2 class="adp-name text-lg font-medium"></h2>
            <span class="source-tag inline-block px-2 py-0.5 text-xs rounded"></span>
          </div>
          <div class="adp-meta text-xs text-slate-500 mt-1"></div>
          <div class="adp-id text-xs text-slate-400 font-mono mt-0.5"></div>
        </div>
      </div>

      <div class="mt-3">
        <div class="text-xs uppercase tracking-wide text-slate-500 mb-1.5 cand-header">Suggested Eldermark matches</div>
        <div class="candidates space-y-1.5"></div>
        <p class="no-cands hidden text-xs text-slate-500 italic mt-1">No fuzzy candidates above threshold — likely an ADP-only role with no Eldermark equivalent. You can mark "no match" or paste an EM ID below.</p>
      </div>

      <details class="mt-3 text-xs text-slate-600 notes-block">
        <summary class="cursor-pointer text-slate-500">Matcher notes</summary>
        <div class="mt-1 notes-body"></div>
      </details>

      <div class="mt-3 flex flex-wrap gap-2 items-center">
        <input class="manual-id border rounded px-2 py-1 text-sm flex-1 min-w-40 font-mono"
               placeholder="Or paste an EM employee_id..." />
        <button class="confirm-btn px-3 py-1 rounded bg-emerald-600 text-white text-sm">Confirm ID</button>
        <button class="reject-btn px-3 py-1 rounded bg-rose-600 text-white text-sm">No match</button>
      </div>
    </article>
  </template>

  <script>
    const rowsEl = document.getElementById("rows");
    const summaryEl = document.getElementById("summary");
    const emptyEl = document.getElementById("empty");
    const tmpl = document.getElementById("row-tmpl");
    const searchEl = document.getElementById("search");
    const deptEl = document.getElementById("dept-filter");
    const commEl = document.getElementById("comm-filter");
    const tabBtns = document.querySelectorAll(".tab-btn");
    const visibleCountEl = document.getElementById("visible-count");

    let _items = [];
    let _activeTab = "manual-review";

    const SUMMARY_LABELS = {
      "exact": ["Exact", "bg-emerald-100 text-emerald-800"],
      "fuzzy": ["Fuzzy", "bg-emerald-50 text-emerald-700"],
      "llm": ["LLM", "bg-indigo-100 text-indigo-800"],
      "manual-review": ["Manual review", "bg-amber-100 text-amber-800"],
      "unmatched": ["Unmatched", "bg-slate-100 text-slate-700"],
    };

    const SOURCE_PILL = {
      "manual-review": "bg-amber-100 text-amber-800",
      "ambiguous-exact": "bg-amber-100 text-amber-800",
      "llm-pending": "bg-indigo-100 text-indigo-800",
      "unmatched": "bg-slate-100 text-slate-700",
    };

    async function load() {
      summaryEl.innerHTML = "Loading...";
      const res = await fetch("/api/pending");
      const data = await res.json();
      if (!res.ok) {
        summaryEl.innerHTML = `<div class="col-span-full bg-rose-50 text-rose-700 p-3 rounded">${data.error || res.statusText}</div>`;
        return;
      }
      _items = data.items || [];
      renderSummary(data.summary || {}, data.total || 0);
      buildFilters(_items);
      renderList();
    }

    function renderSummary(summary, total) {
      summaryEl.innerHTML = "";
      const entries = ["exact", "fuzzy", "llm", "manual-review", "unmatched"];
      for (const k of entries) {
        const [label, cls] = SUMMARY_LABELS[k];
        const n = summary[k] || 0;
        const div = document.createElement("div");
        div.className = `${cls} p-2 rounded`;
        div.innerHTML = `<div class="font-semibold text-sm">${n.toLocaleString()}</div><div>${label}</div>`;
        summaryEl.appendChild(div);
      }
    }

    function buildFilters(items) {
      const depts = new Set(), comms = new Set();
      for (const it of items) {
        if (it.adp_department) depts.add(it.adp_department);
        if (it.adp_community) comms.add(it.adp_community);
      }
      function fill(el, vals, kept) {
        el.innerHTML = `<option value="">${el.options[0].text}</option>`;
        [...vals].sort().forEach(v => {
          const o = document.createElement("option");
          o.value = v; o.textContent = v;
          el.appendChild(o);
        });
        if (kept && [...vals].includes(kept)) el.value = kept;
      }
      fill(deptEl, depts, deptEl.value);
      fill(commEl, comms, commEl.value);
    }

    function renderList() {
      const q = searchEl.value.trim().toLowerCase();
      const dept = deptEl.value;
      const comm = commEl.value;

      const filtered = _items.filter(it => {
        if (_activeTab === "manual-review" && it.match_source !== "manual-review" && it.match_source !== "ambiguous-exact" && it.match_source !== "llm-pending") return false;
        if (_activeTab === "unmatched" && it.match_source !== "unmatched") return false;
        if (dept && it.adp_department !== dept) return false;
        if (comm && it.adp_community !== comm) return false;
        if (q) {
          const hay = `${it.adp_name} ${it.adp_title} ${it.adp_department} ${it.adp_community}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      visibleCountEl.textContent = `${filtered.length.toLocaleString()} shown`;
      rowsEl.innerHTML = "";
      emptyEl.classList.toggle("hidden", filtered.length > 0);
      for (const it of filtered) renderRow(it);
    }

    function renderRow(item) {
      const node = tmpl.content.cloneNode(true);
      const row = node.querySelector(".row");
      row.dataset.adpId = item.adp_associate_id;
      node.querySelector(".adp-name").textContent = item.adp_name;
      const tag = node.querySelector(".source-tag");
      tag.textContent = item.match_source;
      tag.className = `source-tag inline-block px-2 py-0.5 text-xs rounded ${SOURCE_PILL[item.match_source] || "bg-slate-100"}`;
      const metaParts = [item.adp_title, item.adp_department, item.adp_community].filter(Boolean);
      if (item.adp_ytd_hours) metaParts.push(`${item.adp_ytd_hours.toFixed(0)}h YTD`);
      node.querySelector(".adp-meta").textContent = metaParts.join(" · ") || "(no ADP context)";
      node.querySelector(".adp-id").textContent = `ADP: ${item.adp_associate_id}`;

      const candsEl = node.querySelector(".candidates");
      if (!item.candidates || item.candidates.length === 0) {
        node.querySelector(".cand-header").classList.add("hidden");
        node.querySelector(".no-cands").classList.remove("hidden");
      } else {
        // Sort: active candidates first (more YTD services); then by score
        const sorted = [...item.candidates].sort((a, b) => {
          const ay = Number(a.ytd_services || 0), by = Number(b.ytd_services || 0);
          if (ay !== by) return by - ay;
          return Number(b.score || 0) - Number(a.score || 0);
        });
        for (const c of sorted) {
          const btn = document.createElement("button");
          const ytd = Number(c.ytd_services || 0);
          const ytdCls = ytd > 0 ? "bg-emerald-100 text-emerald-800" : "bg-slate-100 text-slate-500";
          const isStale = ytd === 0;
          btn.className = `w-full text-left border rounded px-3 py-2 text-sm hover:bg-emerald-50 hover:border-emerald-300 ${isStale ? "opacity-60" : ""}`;
          btn.innerHTML = `<div class="flex items-baseline justify-between gap-3">
            <div>
              <span class="font-medium">${c.em_name || "—"}</span>
              <span class="text-xs text-slate-400 font-mono ml-2">${c.em_employee_id || ""}</span>
            </div>
            <div class="flex gap-2 items-baseline">
              <span class="text-xs px-1.5 py-0.5 rounded ${ytdCls}">${ytd.toLocaleString()} svc YTD</span>
              <span class="text-xs text-slate-500">${(Number(c.score || 0) * 100).toFixed(0)}%</span>
            </div>
          </div>`;
          btn.onclick = () => decide(item.adp_associate_id, c.em_employee_id, "confirmed", row);
          candsEl.appendChild(btn);
        }
      }

      const notesBlock = node.querySelector(".notes-block");
      if (item.notes) {
        node.querySelector(".notes-body").textContent = item.notes;
      } else {
        notesBlock.classList.add("hidden");
      }

      node.querySelector(".confirm-btn").onclick = () => {
        const id = row.querySelector(".manual-id").value.trim();
        if (id) decide(item.adp_associate_id, id, "manual", row);
      };
      node.querySelector(".reject-btn").onclick = () => decide(item.adp_associate_id, null, "rejected", row);

      rowsEl.appendChild(node);
    }

    async function decide(adp_id, em_id, decision, row) {
      row.classList.add("opacity-50", "pointer-events-none");
      const res = await fetch("/api/decide", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ adp_associate_id: adp_id, em_employee_id: em_id, decision }),
      });
      if (res.ok) {
        row.style.transition = "opacity .2s";
        row.style.opacity = "0";
        setTimeout(() => row.remove(), 200);
      } else {
        row.classList.remove("opacity-50", "pointer-events-none");
        const err = await res.json().catch(() => ({}));
        alert(`Save failed: ${err.error || res.statusText}`);
      }
    }

    document.getElementById("refresh").onclick = load;
    searchEl.addEventListener("input", renderList);
    deptEl.addEventListener("change", renderList);
    commEl.addEventListener("change", renderList);
    tabBtns.forEach(btn => btn.addEventListener("click", () => {
      _activeTab = btn.dataset.tab;
      tabBtns.forEach(b => {
        const active = b === btn;
        b.className = `tab-btn px-3 py-1.5 rounded text-sm ${active ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-700"}`;
      });
      renderList();
    }));
    load();
  </script>
</body>
</html>
