<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Employee Crosswalk Review</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .pulse-dot { animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% {opacity:1} 50% {opacity:.4} }
    .row-leaving { transition: opacity .2s, transform .2s; opacity: 0; transform: translateX(8px); }
  </style>
</head>
<body class="bg-slate-100 text-slate-900">
  <div class="max-w-6xl mx-auto p-4 sm:p-6">
    <header class="mb-5 flex items-end justify-between gap-4">
      <div>
        <h1 class="text-2xl font-semibold tracking-tight">Employee Crosswalk Review</h1>
        <p class="text-sm text-slate-600 mt-0.5">Match ADP punches to Eldermark employees the matcher couldn't auto-resolve.</p>
      </div>
      <button id="refresh" class="px-3 py-2 rounded-md bg-slate-900 text-white text-sm font-medium hover:bg-slate-700 active:bg-slate-800">Refresh</button>
    </header>

    <section id="summary" class="mb-4 grid grid-cols-2 sm:grid-cols-5 gap-2 text-xs"></section>

    <section class="mb-5 flex flex-wrap items-center gap-2 bg-white rounded-lg shadow-sm border border-slate-200 p-3">
      <div class="flex gap-1 mr-2 flex-wrap">
        <span class="text-xs uppercase tracking-wider text-slate-500 self-center mr-1">ADP →</span>
        <button data-tab="manual-review" class="tab-btn px-3 py-1.5 rounded-md text-sm font-medium bg-slate-900 text-white">Manual review</button>
        <button data-tab="unmatched" class="tab-btn px-3 py-1.5 rounded-md text-sm font-medium bg-slate-100 text-slate-700 hover:bg-slate-200">Unmatched</button>
        <button data-tab="all" class="tab-btn px-3 py-1.5 rounded-md text-sm font-medium bg-slate-100 text-slate-700 hover:bg-slate-200">All</button>
        <span class="text-xs uppercase tracking-wider text-slate-500 self-center mx-1">EM →</span>
        <button data-tab="em-unmatched" class="tab-btn px-3 py-1.5 rounded-md text-sm font-medium bg-slate-100 text-slate-700 hover:bg-slate-200">Unmatched <span class="em-tab-count text-slate-400 ml-1"></span></button>
      </div>
      <input id="search" type="search" placeholder="Search by name, community, title…"
             class="flex-1 min-w-48 border border-slate-300 rounded-md px-3 py-1.5 text-sm focus:ring-2 focus:ring-slate-300 focus:outline-none" />
      <select id="dept-filter" class="border border-slate-300 rounded-md px-2 py-1.5 text-sm">
        <option value="">All departments</option>
      </select>
      <select id="comm-filter" class="border border-slate-300 rounded-md px-2 py-1.5 text-sm">
        <option value="">All communities</option>
      </select>
      <span id="visible-count" class="text-xs text-slate-500 ml-auto"></span>
    </section>

    <div id="groups" class="space-y-6"></div>
    <p id="empty" class="hidden text-center text-slate-500 mt-12 text-sm">No items match the current filters.</p>
    <p class="text-xs text-slate-400 text-center mt-10">Activity badges show last 30 days. <span class="pulse-dot inline-block w-1.5 h-1.5 rounded-full bg-emerald-500 align-middle"></span> recent · faded = stale</p>
  </div>

  <template id="em-row-tmpl">
    <article class="row em-row bg-white rounded-lg shadow-sm border border-slate-200 p-4 hover:shadow-md hover:border-slate-300 transition-all">
      <div class="flex items-start justify-between gap-4">
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="inline-block px-1.5 py-0.5 text-[10px] uppercase tracking-wider rounded bg-purple-100 text-purple-800 font-semibold">EM</span>
            <h2 class="em-name text-lg font-medium"></h2>
            <span class="em-svc-badge inline-flex items-center gap-1 px-2 py-0.5 text-xs rounded font-medium"></span>
          </div>
          <div class="em-meta text-xs text-slate-600 mt-1"></div>
          <div class="em-id text-xs text-slate-400 font-mono mt-0.5"></div>
        </div>
      </div>

      <div class="mt-3">
        <div class="text-xs uppercase tracking-wide text-slate-500 mb-1.5 cand-header font-semibold">Suggested ADP matches</div>
        <div class="adp-candidates space-y-1.5"></div>
        <p class="no-cands hidden text-xs text-slate-500 italic mt-1">No likely ADP punchers by name match. Paste an ADP Associate ID below or mark "no match".</p>
      </div>

      <div class="mt-3 flex flex-wrap gap-2 items-center">
        <input class="manual-id border border-slate-300 rounded-md px-2 py-1 text-sm flex-1 min-w-40 font-mono focus:ring-2 focus:ring-slate-300 focus:outline-none"
               placeholder="Or paste an ADP Associate ID…" />
        <button class="confirm-btn px-3 py-1.5 rounded-md bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium">Confirm ID</button>
        <button class="reject-btn px-3 py-1.5 rounded-md bg-rose-600 hover:bg-rose-700 text-white text-sm font-medium">No match</button>
      </div>
    </article>
  </template>

  <template id="row-tmpl">
    <article class="row bg-white rounded-lg shadow-sm border border-slate-200 p-4 hover:shadow-md hover:border-slate-300 transition-all">
      <div class="flex items-start justify-between gap-4">
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <h2 class="adp-name text-lg font-medium"></h2>
            <span class="source-tag inline-block px-2 py-0.5 text-xs font-medium rounded"></span>
            <span class="activity-30d inline-flex items-center gap-1 px-2 py-0.5 text-xs rounded font-medium"></span>
          </div>
          <div class="adp-meta text-xs text-slate-600 mt-1"></div>
          <div class="adp-id text-xs text-slate-400 font-mono mt-0.5"></div>
        </div>
      </div>

      <div class="mt-3">
        <div class="text-xs uppercase tracking-wide text-slate-500 mb-1.5 cand-header font-semibold">Suggested Eldermark matches</div>
        <div class="candidates space-y-1.5"></div>
        <p class="no-cands hidden text-xs text-slate-500 italic mt-1">No fuzzy candidates above threshold — likely an ADP-only role with no Eldermark equivalent. You can mark "no match" or paste an EM ID below.</p>
      </div>

      <details class="mt-3 text-xs text-slate-600 notes-block">
        <summary class="cursor-pointer text-slate-500 hover:text-slate-700">Matcher notes</summary>
        <div class="mt-1 notes-body"></div>
      </details>

      <div class="mt-3 flex flex-wrap gap-2 items-center">
        <input class="manual-id border border-slate-300 rounded-md px-2 py-1 text-sm flex-1 min-w-40 font-mono focus:ring-2 focus:ring-slate-300 focus:outline-none"
               placeholder="Or paste an EM employee_id…" />
        <button class="confirm-btn px-3 py-1.5 rounded-md bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium">Confirm ID</button>
        <button class="reject-btn px-3 py-1.5 rounded-md bg-rose-600 hover:bg-rose-700 text-white text-sm font-medium">No match</button>
      </div>
    </article>
  </template>

  <script>
    const groupsEl = document.getElementById("groups");
    const summaryEl = document.getElementById("summary");
    const emptyEl = document.getElementById("empty");
    const tmpl = document.getElementById("row-tmpl");
    const searchEl = document.getElementById("search");
    const deptEl = document.getElementById("dept-filter");
    const commEl = document.getElementById("comm-filter");
    const tabBtns = document.querySelectorAll(".tab-btn");
    const visibleCountEl = document.getElementById("visible-count");

    let _items = [];
    let _emItems = [];
    let _activeTab = "manual-review";

    const SUMMARY_LABELS = {
      "exact": ["Exact", "bg-emerald-100 text-emerald-800"],
      "fuzzy": ["Fuzzy", "bg-emerald-50 text-emerald-700"],
      "llm": ["LLM", "bg-indigo-100 text-indigo-800"],
      "manual-review": ["Manual review", "bg-amber-100 text-amber-800"],
      "unmatched": ["Unmatched", "bg-slate-100 text-slate-700"],
    };

    const SOURCE_PILL = {
      "manual-review": "bg-amber-100 text-amber-800",
      "ambiguous-exact": "bg-amber-100 text-amber-800",
      "llm-pending": "bg-indigo-100 text-indigo-800",
      "unmatched": "bg-slate-100 text-slate-700",
    };

    async function load() {
      summaryEl.innerHTML = `<div class="col-span-full text-slate-500 text-sm py-2">Loading…</div>`;
      groupsEl.innerHTML = "";
      const res = await fetch("/api/pending");
      const data = await res.json();
      if (!res.ok) {
        summaryEl.innerHTML = `<div class="col-span-full bg-rose-50 text-rose-700 p-3 rounded-md border border-rose-200">${data.error || res.statusText}</div>`;
        return;
      }
      _items = data.items || [];
      _emItems = data.em_items || [];
      // Update the EM tab badge with the unmatched-EM count
      const emBadge = document.querySelector(".em-tab-count");
      if (emBadge) emBadge.textContent = _emItems.length ? `(${_emItems.length})` : "";
      renderSummary(data.summary || {}, data.total || 0);
      buildFilters(_items);
      renderList();
    }

    function renderSummary(summary, total) {
      summaryEl.innerHTML = "";
      const entries = ["exact", "fuzzy", "llm", "manual-review", "unmatched"];
      for (const k of entries) {
        const [label, cls] = SUMMARY_LABELS[k];
        const n = summary[k] || 0;
        const div = document.createElement("div");
        div.className = `${cls} px-3 py-2 rounded-md`;
        div.innerHTML = `<div class="font-semibold text-base leading-tight">${n.toLocaleString()}</div><div class="text-xs mt-0.5">${label}</div>`;
        summaryEl.appendChild(div);
      }
    }

    function buildFilters(items) {
      const depts = new Set(), comms = new Set();
      for (const it of items) {
        if (it.adp_department) depts.add(it.adp_department);
        if (it.adp_community) comms.add(it.adp_community);
      }
      function fill(el, vals, kept) {
        const head = el.options[0].text;
        el.innerHTML = `<option value="">${head}</option>`;
        [...vals].sort().forEach(v => {
          const o = document.createElement("option");
          o.value = v; o.textContent = v;
          el.appendChild(o);
        });
        if (kept && [...vals].includes(kept)) el.value = kept;
      }
      fill(deptEl, depts, deptEl.value);
      fill(commEl, comms, commEl.value);
    }

    function renderList() {
      const q = searchEl.value.trim().toLowerCase();
      const dept = deptEl.value;
      const comm = commEl.value;

      groupsEl.innerHTML = "";

      // EM-anchored tab uses _emItems and a different row template
      if (_activeTab === "em-unmatched") {
        const filteredEm = _emItems.filter(it => {
          if (q) {
            const hay = `${it.em_name} ${it.em_title}`.toLowerCase();
            if (!hay.includes(q)) return false;
          }
          // Department / community filters target ADP fields and don't apply to
          // EM-anchored cards (EM employees don't carry ADP department).
          return true;
        });
        visibleCountEl.textContent = `${filteredEm.length.toLocaleString()} shown`;
        emptyEl.classList.toggle("hidden", filteredEm.length > 0);
        if (!filteredEm.length) return;

        const intro = document.createElement("div");
        intro.className = "bg-purple-50 border border-purple-200 rounded-md p-3 text-sm text-purple-900 mb-2";
        intro.innerHTML = `<strong>Eldermark employees performing services with no matched ADP associate.</strong>
          These are real care workers who are clocking services but the matcher couldn't find their ADP profile.
          Confirm the right ADP person to close the loop.`;
        groupsEl.appendChild(intro);

        const rowsWrap = document.createElement("div");
        rowsWrap.className = "space-y-2";
        for (const it of filteredEm) renderEmRow(it, rowsWrap);
        groupsEl.appendChild(rowsWrap);
        return;
      }

      // ADP-anchored tabs (manual-review / unmatched / all)
      const filtered = _items.filter(it => {
        if (_activeTab === "manual-review" && it.match_source !== "manual-review" && it.match_source !== "ambiguous-exact" && it.match_source !== "llm-pending") return false;
        if (_activeTab === "unmatched" && it.match_source !== "unmatched") return false;
        if (dept && it.adp_department !== dept) return false;
        if (comm && it.adp_community !== comm) return false;
        if (q) {
          const hay = `${it.adp_name} ${it.adp_title} ${it.adp_department} ${it.adp_community}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      visibleCountEl.textContent = `${filtered.length.toLocaleString()} shown`;
      emptyEl.classList.toggle("hidden", filtered.length > 0);

      // Group by community
      const buckets = new Map();
      for (const it of filtered) {
        const key = it.adp_community || "(no community)";
        if (!buckets.has(key)) buckets.set(key, []);
        buckets.get(key).push(it);
      }

      for (const [community, list] of buckets) {
        const section = document.createElement("section");
        section.className = "community-group";
        const header = document.createElement("div");
        header.className = "flex items-center gap-2 mb-2 px-1";
        header.innerHTML = `
          <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-700">${escapeHtml(community)}</h3>
          <div class="flex-1 border-t border-slate-300"></div>
          <span class="text-xs text-slate-500 font-medium">${list.length} ${list.length === 1 ? "person" : "people"}</span>
        `;
        section.appendChild(header);
        const rowsWrap = document.createElement("div");
        rowsWrap.className = "space-y-2";
        for (const it of list) renderRow(it, rowsWrap);
        section.appendChild(rowsWrap);
        groupsEl.appendChild(section);
      }
    }

    function renderEmRow(item, container) {
      const tmplEm = document.getElementById("em-row-tmpl");
      const node = tmplEm.content.cloneNode(true);
      const row = node.querySelector(".row");
      row.dataset.emId = item.em_employee_id;

      node.querySelector(".em-name").textContent = item.em_name || item.em_employee_id;
      const svcBadge = node.querySelector(".em-svc-badge");
      const svc30 = Number(item.svc_hrs_30d || 0);
      const cnt30 = Number(item.svc_count_30d || 0);
      const svcDot = svc30 > 0 ? `<span class="pulse-dot inline-block w-1.5 h-1.5 rounded-full bg-emerald-500"></span>` : "";
      svcBadge.outerHTML = `<span class="inline-flex items-center gap-1 px-2 py-0.5 text-xs rounded bg-emerald-100 text-emerald-800 font-medium">${svcDot}${svc30.toFixed(0)} svc hrs · ${cnt30.toLocaleString()} services 30d</span>`;

      const metaParts = [item.em_title, item.em_hire_date ? `hired ${String(item.em_hire_date).slice(0, 10)}` : ""].filter(Boolean);
      node.querySelector(".em-meta").textContent = metaParts.join(" · ") || "(no title)";
      node.querySelector(".em-id").textContent = `EM: ${item.em_employee_id}`;

      const candsEl = node.querySelector(".adp-candidates");
      if (!item.adp_candidates || item.adp_candidates.length === 0) {
        node.querySelector(".cand-header").classList.add("hidden");
        node.querySelector(".no-cands").classList.remove("hidden");
      } else {
        for (const c of item.adp_candidates) {
          const btn = document.createElement("button");
          const punchH = Number(c.adp_hours_30d || 0);
          const isStale = punchH === 0;
          btn.className = `w-full text-left border rounded-md px-3 py-2 text-sm hover:bg-emerald-50 hover:border-emerald-400 ${isStale ? "opacity-50 border-slate-200" : "border-slate-300"}`;
          const dot = punchH > 0 ? `<span class="pulse-dot inline-block w-1.5 h-1.5 rounded-full bg-emerald-500"></span>` : "";
          const punchBadge = punchH > 0
            ? `<span class="inline-flex items-center gap-1 text-xs px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800 font-medium">${dot}${punchH.toFixed(0)} punch hrs 30d</span>`
            : `<span class="text-xs px-1.5 py-0.5 rounded bg-slate-100 text-slate-500">No punches 30d</span>`;
          const meta = [c.adp_title, c.adp_community].filter(Boolean).join(" · ");
          btn.innerHTML = `<div class="flex items-baseline justify-between gap-3">
            <div class="min-w-0 flex-1">
              <div>
                <span class="font-medium">${escapeHtml(c.adp_name || "—")}</span>
                <span class="text-xs text-slate-400 font-mono ml-2">${escapeHtml(c.adp_associate_id || "")}</span>
              </div>
              ${meta ? `<div class="text-xs text-slate-500 mt-0.5">${escapeHtml(meta)}</div>` : ""}
            </div>
            <div class="flex gap-2 items-baseline shrink-0 flex-wrap justify-end">
              ${punchBadge}
              <span class="text-xs text-slate-500">${(Number(c.score || 0) * 100).toFixed(0)}%</span>
            </div>
          </div>`;
          btn.onclick = () => decide(c.adp_associate_id, item.em_employee_id, "confirmed", row);
          candsEl.appendChild(btn);
        }
      }

      node.querySelector(".confirm-btn").onclick = () => {
        const id = row.querySelector(".manual-id").value.trim();
        if (id) decide(id, item.em_employee_id, "manual", row);
      };
      node.querySelector(".reject-btn").onclick = () => decide(null, item.em_employee_id, "rejected", row);

      container.appendChild(node);
    }

    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    }

    function activityBadge(hours, kind /* "punch" | "service" */) {
      // hours: numeric hours in last 30 days. kind drives wording.
      const isActive = hours > 0;
      if (!isActive) {
        return `<span class="px-2 py-0.5 text-xs rounded bg-slate-100 text-slate-500">No ${kind === "punch" ? "punches" : "services"} 30d</span>`;
      }
      const cls = hours >= 40 ? "bg-emerald-100 text-emerald-800" : "bg-emerald-50 text-emerald-700";
      const dot = `<span class="pulse-dot inline-block w-1.5 h-1.5 rounded-full bg-emerald-500"></span>`;
      const label = kind === "punch" ? "punch hrs" : "svc hrs";
      return `<span class="inline-flex items-center gap-1 px-2 py-0.5 text-xs rounded ${cls} font-medium">${dot}${hours.toFixed(0)} ${label} 30d</span>`;
    }

    function renderRow(item, container) {
      const node = tmpl.content.cloneNode(true);
      const row = node.querySelector(".row");
      row.dataset.adpId = item.adp_associate_id;
      node.querySelector(".adp-name").textContent = item.adp_name || "(no name)";
      const tag = node.querySelector(".source-tag");
      tag.textContent = item.match_source;
      tag.className = `source-tag inline-block px-2 py-0.5 text-xs font-medium rounded ${SOURCE_PILL[item.match_source] || "bg-slate-100"}`;

      // 30-day activity badge for ADP person
      const actEl = node.querySelector(".activity-30d");
      const punchH = Number(item.adp_hours_30d || 0);
      actEl.outerHTML = activityBadge(punchH, "punch");

      const metaParts = [item.adp_title, item.adp_department].filter(Boolean);
      if (item.adp_ytd_hours) metaParts.push(`${item.adp_ytd_hours.toFixed(0)}h YTD`);
      node.querySelector(".adp-meta").textContent = metaParts.join(" · ") || "(no ADP context)";
      node.querySelector(".adp-id").textContent = `ADP: ${item.adp_associate_id}`;

      const candsEl = node.querySelector(".candidates");
      if (!item.candidates || item.candidates.length === 0) {
        node.querySelector(".cand-header").classList.add("hidden");
        node.querySelector(".no-cands").classList.remove("hidden");
      } else {
        // Sort: active EM accounts first, then 30-day activity, then YTD, then score.
        // Inactive duplicates sink to the bottom so the right one is at the top.
        const sorted = [...item.candidates].sort((a, b) => {
          if (!!a.inactive !== !!b.inactive) return a.inactive ? 1 : -1;
          const a30 = Number(a.svc_hrs_30d || 0), b30 = Number(b.svc_hrs_30d || 0);
          if (a30 !== b30) return b30 - a30;
          const ay = Number(a.ytd_services || 0), by = Number(b.ytd_services || 0);
          if (ay !== by) return by - ay;
          return Number(b.score || 0) - Number(a.score || 0);
        });
        for (const c of sorted) {
          const btn = document.createElement("button");
          const ytd = Number(c.ytd_services || 0);
          const svc30 = Number(c.svc_hrs_30d || 0);
          const isStale = svc30 === 0 && ytd === 0;
          const isInactive = !!c.inactive;
          const score = Number(c.score || 0);
          // Inactive overrides the stale styling: red ring + 60% opacity so it's clearly demoted
          let frame = "border-slate-300";
          let opacity = "";
          if (isInactive) {
            frame = "border-rose-300 bg-rose-50/40";
            opacity = "opacity-70";
          } else if (isStale) {
            frame = "border-slate-200";
            opacity = "opacity-50";
          }
          btn.className = `w-full text-left border rounded-md px-3 py-2 text-sm hover:bg-emerald-50 hover:border-emerald-400 ${frame} ${opacity}`;
          const dot = svc30 > 0 ? `<span class="pulse-dot inline-block w-1.5 h-1.5 rounded-full bg-emerald-500"></span>` : "";
          const inactiveBadge = isInactive
            ? `<span class="inline-flex items-center gap-1 text-xs px-1.5 py-0.5 rounded bg-rose-100 text-rose-800 font-semibold">Inactive</span>`
            : "";
          const recentBadge = svc30 > 0
            ? `<span class="inline-flex items-center gap-1 text-xs px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800 font-medium">${dot}${svc30.toFixed(0)} svc hrs 30d</span>`
            : `<span class="text-xs px-1.5 py-0.5 rounded bg-slate-100 text-slate-500">No svc 30d</span>`;
          const ytdBadge = ytd > 0
            ? `<span class="text-xs text-slate-500">${ytd.toLocaleString()} svc YTD</span>`
            : "";
          const titleLine = c.em_title
            ? `<div class="text-xs text-slate-500 mt-0.5">${escapeHtml(c.em_title)}${c.em_hire_date ? ` · hired ${escapeHtml(String(c.em_hire_date).slice(0, 10))}` : ""}</div>`
            : "";
          btn.innerHTML = `<div class="flex items-baseline justify-between gap-3">
            <div class="min-w-0 flex-1">
              <div>
                <span class="font-medium">${escapeHtml(c.em_name || "—")}</span>
                <span class="text-xs text-slate-400 font-mono ml-2">${escapeHtml(c.em_employee_id || "")}</span>
              </div>
              ${titleLine}
            </div>
            <div class="flex gap-2 items-baseline shrink-0 flex-wrap justify-end">
              ${inactiveBadge}
              ${recentBadge}
              ${ytdBadge}
              <span class="text-xs text-slate-500">${(score * 100).toFixed(0)}%</span>
            </div>
          </div>`;
          btn.onclick = () => decide(item.adp_associate_id, c.em_employee_id, "confirmed", row);
          candsEl.appendChild(btn);
        }
      }

      const notesBlock = node.querySelector(".notes-block");
      if (item.notes) {
        node.querySelector(".notes-body").textContent = item.notes;
      } else {
        notesBlock.classList.add("hidden");
      }

      node.querySelector(".confirm-btn").onclick = () => {
        const id = row.querySelector(".manual-id").value.trim();
        if (id) decide(item.adp_associate_id, id, "manual", row);
      };
      node.querySelector(".reject-btn").onclick = () => decide(item.adp_associate_id, null, "rejected", row);

      container.appendChild(node);
    }

    async function decide(adp_id, em_id, decision, row) {
      row.classList.add("opacity-50", "pointer-events-none");
      const res = await fetch("/api/decide", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ adp_associate_id: adp_id, em_employee_id: em_id, decision }),
      });
      if (res.ok) {
        row.classList.add("row-leaving");
        setTimeout(() => {
          row.remove();
          // Remove an entire community group if it just emptied out
          document.querySelectorAll(".community-group").forEach((g) => {
            if (!g.querySelector(".row")) g.remove();
          });
        }, 220);
      } else {
        row.classList.remove("opacity-50", "pointer-events-none");
        const err = await res.json().catch(() => ({}));
        alert(`Save failed: ${err.error || res.statusText}`);
      }
    }

    document.getElementById("refresh").onclick = load;
    searchEl.addEventListener("input", renderList);
    deptEl.addEventListener("change", renderList);
    commEl.addEventListener("change", renderList);
    tabBtns.forEach(btn => btn.addEventListener("click", () => {
      _activeTab = btn.dataset.tab;
      tabBtns.forEach(b => {
        const active = b === btn;
        b.className = `tab-btn px-3 py-1.5 rounded-md text-sm font-medium ${active ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-700 hover:bg-slate-200"}`;
      });
      // Department + community filters are ADP-side only; hide them when viewing EM-anchored
      const isEm = _activeTab === "em-unmatched";
      deptEl.classList.toggle("hidden", isEm);
      commEl.classList.toggle("hidden", isEm);
      renderList();
    }));
    load();
  </script>
</body>
</html>
